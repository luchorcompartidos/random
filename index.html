<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="app-version" content="v0.0.2">
<meta name="theme-color" content="#4f46e5">
<title>Random · Selecciones aleatorias</title>
<script>
  // Tema antes de dibujar, para evitar el destello claro en modo oscuro
  try{ var _d = JSON.parse(localStorage.getItem("random_app_v1") || "{}"), _t = _d.theme || "system";
    if(_t === "system") _t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = _t; }catch(e){}
</script>
<style>
  :root{--bg:#f4f5f9;--card:#fff;--inp:#fff;--tx:#1c1f26;--mut:#6b7280;--bd:#e3e6ec;--ac:#4f46e5;--ac2:#eef2ff;--acTx:#312e81;--off:#fafafa;--bad:#dc2626;--tagBg:#fef3c7;--tagTx:#92400e;--r:14px;color-scheme:light}
  :root[data-theme=dark]{--bg:#0f1115;--card:#181b22;--inp:#11141a;--tx:#e6e8ee;--mut:#9aa1ad;--bd:#2c313c;--ac:#6366f1;--ac2:#252a4d;--acTx:#c7d2fe;--off:#14161b;--bad:#f87171;--tagBg:#3a2e12;--tagTx:#fcd34d;color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:var(--ac)}
  header{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--bd)}
  .hd{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto;padding:10px 14px 6px}
  .hd h1{margin:0;font-size:20px}
  .sp{flex:1}
  nav{display:flex;max-width:760px;margin:0 auto;padding:0 6px}
  nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;white-space:nowrap;border:0;background:none;padding:6px 2px 8px;font:600 12px system-ui,sans-serif;color:var(--mut);border-bottom:3px solid transparent;cursor:pointer}
  nav button.on{color:var(--ac);border-bottom-color:var(--ac)}
  .setbar{display:flex;align-items:center;gap:8px;max-width:760px;margin:0 auto;padding:6px 14px 8px;border-top:1px solid var(--bd);font-size:13px;color:var(--mut)}
  .setbar select{flex:1;font-weight:600}
  main{max-width:760px;margin:0 auto;padding:14px 12px 80px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:12px}
  h2{font-size:16px;margin:0 0 8px}
  h3{font-size:14px;margin:12px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
  .mut{color:var(--mut)} .sm{font-size:13px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
  .tools{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px;margin-bottom:10px}
  .tools .ord{flex:1 1 150px}
  .btn{border:1px solid var(--bd);border-radius:10px;padding:8px 13px;background:var(--card);color:var(--tx);font:14px system-ui,sans-serif;cursor:pointer}
  .btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
  .btn.big{width:100%;padding:14px;font-size:18px;font-weight:700;margin:10px 0 6px}
  .btn.danger{color:var(--bad)}
  .btn.on{background:var(--ac2);border-color:var(--ac);color:var(--acTx);font-weight:600}
  .btn.sm{padding:7px 10px;font-size:13px}
  .vs-dlg h3{color:inherit;text-transform:none;letter-spacing:0;font-size:17px}
  .badge{display:inline-block;padding:6px 10px;border-radius:10px;background:var(--ac2);color:var(--acTx);font-size:13px;font-weight:600}
  .ic{border:0;background:none;font-size:16px;padding:6px;cursor:pointer;color:var(--mut);border-radius:8px;line-height:1}
  .ic:hover{background:var(--bg)}
  input,select,textarea{font:15px system-ui,sans-serif;color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:7px 9px;background:var(--inp);min-width:0}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--ac2);border-color:var(--ac)}
  input[type=checkbox]{width:20px;height:20px;accent-color:var(--ac);flex:none;margin:0}
  label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
  label.chk{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--tx);margin-top:10px}
  .cfg{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px}
  .cfg label{min-width:0}.cfg select,.cfg input{width:100%}
  /* Resultado */
  .picks{display:flex;flex-wrap:wrap;gap:8px}
  .pick{display:inline-flex;flex-direction:column;background:var(--ac2);color:var(--acTx);border-radius:12px;padding:10px 14px;font-size:20px;font-weight:700}
  .pick small{font-size:12px;font-weight:500;color:var(--mut)}
  .res{border-color:var(--ac)}
  .res.spin .pick{opacity:.55}
  /* Chances */
  table.ch{width:100%;border-collapse:collapse}
  table.ch td{padding:6px 4px;border-top:1px solid var(--bd);vertical-align:middle}
  table.ch td small{display:block;color:var(--mut);font-size:12px}
  td.bar{width:34%}
  td.bar i{display:block;height:8px;border-radius:9px;background:var(--ac);min-width:2px}
  td.pc{width:56px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:9px;background:var(--tagBg);color:var(--tagTx);margin-left:6px}
  details{margin-top:10px} summary{cursor:pointer;color:var(--mut);font-size:14px}
  ul.ex{margin:6px 0 0;padding-left:18px;font-size:14px}
  ul.ex small{color:var(--mut)}
  /* Conjuntos y subconjuntos */
  .gh{display:flex;align-items:center;gap:6px}
  .gname{flex:1;font-weight:700;font-size:16px}
  .wt{flex-direction:row;align-items:center;gap:2px;font-size:14px;color:var(--mut)}
  .wt input{width:62px;text-align:center}
  .hdl{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--mut);font-size:18px;padding:4px 2px;line-height:1}
  .dragging{opacity:.85;outline:2px dashed var(--ac);outline-offset:2px;position:relative;z-index:5;background:var(--card)}
  body.arrastrando{user-select:none;-webkit-user-select:none;cursor:grabbing}
  .set.act{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
  .meta{margin:6px 0 0}
  .sub{margin-top:8px}
  .srow{display:flex;align-items:center;gap:6px;padding:7px 0;border-top:1px solid var(--bd)}
  .srow .sn{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .srow.off .sn{opacity:.45;text-decoration:line-through}
  .items{margin-top:8px}
  .it{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}
  .it .i2{grid-column:3 / 6;display:flex;align-items:center;gap:4px}
  .it .itags{flex:1;font-size:13px;padding:5px 8px;color:var(--mut)}
  .hits{font-size:12px;color:var(--mut);white-space:nowrap;padding:0 4px}
  .off .gname,.it.off .iname,.it.off .itags,.grp.off .items{opacity:.45}
  .grp.off{background:var(--off)}
  /* Reglas */
  .rule{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--bd)}
  .rule .rt{flex:1}
  .rule.off .rt{opacity:.45;text-decoration:line-through}
  /* Historial */
  .hrow{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:9px 0;border-top:1px solid var(--bd)}
  /* Diálogo */
  .dlg{border:1px solid var(--bd);border-radius:16px;padding:18px;width:min(520px,94vw);color:var(--tx);background:var(--card)}
  .dlg::backdrop{background:rgba(15,23,42,.45)}
  .dlg h3{margin:0 0 12px;color:var(--tx);text-transform:none;font-size:17px;letter-spacing:0}
  .dlg label{margin-bottom:10px}
  .dlg textarea{width:100%;min-height:170px;font-size:14px}
  .dlg .acts{justify-content:flex-end}
  .menu .btn{width:100%;text-align:left;margin-bottom:8px}
  .seg{display:flex;gap:6px;margin-bottom:14px}.seg .btn{flex:1;text-align:center;margin:0}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#1c1f26;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:9999;max-width:90vw;text-align:center}
  #toast.on{opacity:1;transform:translateX(-50%)}
  /* Bloque de versión en modo oscuro */
  [data-theme=dark] .vs-ver{background:var(--card);color:var(--mut);border-color:var(--bd)}
  [data-theme=dark] .vs-dlg{background:var(--card);color:var(--tx);border-color:var(--bd)}
  [data-theme=dark] .vs-dlg .vs-mut,[data-theme=dark] .vs-dlg .vs-rel pre{color:var(--mut)}
  [data-theme=dark] .vs-dlg .vs-rel{border-color:var(--bd)}
  [data-theme=dark] .vs-dlg .vs-acts button,[data-theme=dark] .vs-dlg .vs-acts a{background:var(--card);color:var(--tx);border-color:var(--bd)}
  [data-theme=dark] .vs-dlg .vs-acts .vs-pri{background:var(--ac);border-color:var(--ac);color:#fff}
  @media (max-width:420px){ nav button{font-size:11px} .cfg{grid-template-columns:84px minmax(0,1fr)} }
</style>
</head>
<body>
<header>
  <div class="hd">
    <h1>🎲 Random</h1>
    <button id="verBtn" class="vs-ver" type="button">v—</button>
    <span class="sp"></span>
    <button class="ic" id="menuBtn" type="button" title="Más opciones">⋯</button>
  </div>
  <nav id="tabs"></nav>
  <div id="setbar"></div>
</header>
<main id="main"></main>
<dialog class="dlg" id="dlg"></dialog>
<div id="toast" role="status"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
(function(){
  "use strict";
  const KEY = "random_app_v1";
  const $ = (s, el=document) => el.querySelector(s);
  const main = $("#main");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const norm = s => String(s || "").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const uid = () => Math.random().toString(36).slice(2, 10);
  const num = (v, d = 1) => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) && n >= 0 ? n : d; };
  const fmtN = n => String(Math.round(n * 100) / 100).replace(".", ",");
  const fmtD = t => new Date(t).toLocaleString("es-AR", {day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit"});
  const pct = p => p >= 0.9995 ? "100%" : p > 0 && p < 0.001 ? "<0,1%" : (p * 100).toFixed(p < 0.1 ? 1 : 0).replace(".", ",") + "%";
  const mkI = (name, weight = 1, tags = []) => ({id: uid(), name, weight, tags, active: true, hits: 0});
  const pl = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;
  const SORT0 = {sets: "manual", groups: "manual", items: "manual"};

  // ---------- Datos ----------
  // Estado: { sets:[conjunto], active, tab, theme, sort }. Cada conjunto es independiente:
  // { id, name, collapsed, groups:[subconjunto], rules, cfg, history, hitsResetAt, hitsBackup }
  function nuevoSet(name){ return {id: uid(), name, collapsed: false, groups: [], rules: [], cfg: {count: 1, mode: "global", replace: false}, history: [], hitsResetAt: 0}; }
  function ejemploSet(){
    const s = nuevoSet("Comidas y planes");
    s.groups = [
      {id: uid(), name: "Cenas", active: true, weight: 1, items: [
        mkI("Pizza", 1, ["rápida"]), mkI("Milanesas con puré", 2, ["casera"]), mkI("Sushi", 1, ["salida"]),
        mkI("Guiso de lentejas", 1, ["casera", "invierno"]), mkI("Hamburguesas", 1, ["rápida"]), mkI("Empanadas", 1, ["rápida", "casera"])]},
      {id: uid(), name: "Planes del finde", active: true, weight: 1, items: [
        mkI("Parque", 1, ["aire libre"]), mkI("Cine", 1, ["salida"]), mkI("Museo", 1, ["salida"]),
        mkI("Juegos de mesa", 1, ["casa"]), mkI("Bici", 1, ["aire libre"])]}
    ];
    s.rules = [
      {id: uid(), active: true, type: "excluir", tk: "hist", tv: "", n: 2, factor: 1},
      {id: uid(), active: true, type: "peso", tk: "tag", tv: "casera", n: 3, factor: 2}
    ];
    s.cfg = {count: 1, mode: "grupo", replace: false};
    return s;
  }
  function normSet(s){
    if(!s || !Array.isArray(s.groups)) return null;
    s.id = s.id || uid(); s.name = s.name ?? "Conjunto"; s.collapsed = !!s.collapsed;
    s.groups.forEach(g => { g.id = g.id || uid(); g.items = Array.isArray(g.items) ? g.items : []; g.active = g.active !== false; g.weight = num(g.weight, 1);
      g.items.forEach(it => { it.id = it.id || uid(); it.tags = Array.isArray(it.tags) ? it.tags : []; it.active = it.active !== false; it.weight = num(it.weight, 1); it.hits = Math.max(0, parseInt(it.hits) || 0); }); });
    s.rules = Array.isArray(s.rules) ? s.rules : [];
    s.history = Array.isArray(s.history) ? s.history : [];
    s.cfg = Object.assign({count: 1, mode: "global", replace: false}, s.cfg || {});
    s.hitsResetAt = s.hitsResetAt || 0;
    return s;
  }
  function cargar(raw){
    if(!raw) return null;
    if(Array.isArray(raw.sets)){
      const sets = raw.sets.map(normSet).filter(Boolean); if(!sets.length) return null;
      return {sets, active: sets.some(s => s.id === raw.active) ? raw.active : sets[0].id, tab: raw.tab || "sortear",
              theme: raw.theme || "system", sort: Object.assign({}, SORT0, raw.sort || {})};
    }
    if(Array.isArray(raw.groups)){ // Formato v0.0.1: un solo juego de subconjuntos → pasa a un conjunto
      const sinContador = !raw.groups.some(g => (g.items || []).some(i => i.hits != null));
      const s = normSet({name: "Mi conjunto", groups: raw.groups, rules: raw.rules, cfg: raw.cfg, history: raw.history});
      if(!s) return null;
      if(sinContador){ const c = {}; s.history.forEach(h => (h.picks || []).forEach(p => c[p.id] = (c[p.id] || 0) + 1)); s.groups.forEach(g => g.items.forEach(i => i.hits = c[i.id] || 0)); }
      return {sets: [s], active: s.id, tab: raw.tab || "sortear", theme: raw.theme || "system", sort: {...SORT0}};
    }
    return null;
  }
  let S = null;
  try{ S = cargar(JSON.parse(localStorage.getItem(KEY))); }catch(e){}
  if(!S){ const s = ejemploSet(); S = {sets: [s], active: s.id, tab: "sortear", theme: "system", sort: {...SORT0}}; }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("No se pudo guardar en este navegador"); } }
  const C = () => S.sets.find(s => s.id === S.active) || S.sets[0];
  const cnt = () => Math.max(1, Math.min(999, parseInt(C().cfg.count) || 1));
  const allTags = () => [...new Set(C().groups.flatMap(g => g.items.flatMap(i => i.tags || [])).filter(Boolean))].sort((a, b) => a.localeCompare(b, "es"));
  const hitsI = i => i.hits || 0;
  const hitsG = g => g.items.reduce((a, i) => a + hitsI(i), 0);
  const hitsS = s => s.groups.reduce((a, g) => a + hitsG(g), 0);
  const itemsS = s => s.groups.reduce((a, g) => a + g.items.length, 0);
  function clonarSet(s, name, conHist){
    const c = JSON.parse(JSON.stringify(s)), gm = {}, im = {};
    c.id = uid(); if(name != null) c.name = name; c.collapsed = false;
    c.groups.forEach(g => { gm[g.id] = g.id = uid(); g.items.forEach(i => { const n = uid(); im[i.id] = n; i.id = n; if(!conHist) i.hits = 0; }); });
    c.rules.forEach(r => { r.id = uid(); if(r.tk === "group") r.tv = gm[r.tv] || r.tv; });
    if(conHist){
      c.history.forEach(h => { h.id = uid(); (h.picks || []).forEach(p => p.id = im[p.id] || p.id); (h.secs || []).forEach(sc => sc.items.forEach(p => p.id = im[p.id] || p.id)); });
      if(c.hitsBackup){ const nh = {}; for(const k in c.hitsBackup.hits) nh[im[k] || k] = c.hitsBackup.hits[k]; c.hitsBackup.hits = nh; }
    } else { c.history = []; delete c.hitsBackup; c.hitsResetAt = 0; }
    return c;
  }

  // ---------- Tema ----------
  const mq = matchMedia("(prefers-color-scheme: dark)");
  function aplicarTema(){
    const t = S.theme === "system" ? (mq.matches ? "dark" : "light") : S.theme;
    document.documentElement.dataset.theme = t;
    const m = document.querySelector('meta[name="theme-color"]'); if(m) m.content = t === "dark" ? "#181b22" : "#4f46e5";
  }
  (mq.addEventListener ? mq.addEventListener("change", aplicarTema) : mq.addListener(aplicarTema));
  aplicarTema();

  // ---------- Orden ----------
  const SORTS = {
    sets:   [["manual","Manual"],["az","Nombre A–Z"],["za","Nombre Z–A"],["items","Más ítems"],["mas","Más sorteados"],["menos","Menos sorteados"]],
    groups: [["manual","Manual"],["az","Nombre A–Z"],["za","Nombre Z–A"],["pesoD","Mayor peso"],["pesoA","Menor peso"],["items","Más ítems"],["activos","Activos primero"],["mas","Más sorteados"],["menos","Menos sorteados"]],
    items:  [["manual","Manual"],["az","Nombre A–Z"],["za","Nombre Z–A"],["pesoD","Mayor peso"],["pesoA","Menor peso"],["activos","Activos primero"],["mas","Más sorteados"],["menos","Menos sorteados"]]
  };
  const SORT_LBL = {sets: "Ordenar conjuntos", groups: "Ordenar subconjuntos", items: "Ordenar ítems"};
  function ordenar(arr, lvl){
    const k = S.sort[lvl] || "manual"; if(k === "manual") return arr.slice();
    const h = lvl === "sets" ? hitsS : lvl === "groups" ? hitsG : hitsI;
    const n = lvl === "sets" ? itemsS : g => g.items.length;
    const nm = (a, b) => String(a.name || "").localeCompare(String(b.name || ""), "es", {sensitivity: "base", numeric: true});
    const f = {az: nm, za: (a, b) => nm(b, a), pesoD: (a, b) => num(b.weight) - num(a.weight), pesoA: (a, b) => num(a.weight) - num(b.weight),
               items: (a, b) => n(b) - n(a), activos: (a, b) => (b.active !== false) - (a.active !== false), mas: (a, b) => h(b) - h(a), menos: (a, b) => h(a) - h(b)}[k];
    return f ? arr.slice().sort(f) : arr.slice();
  }
  const selOrden = lvl => `<label class="ord">${SORT_LBL[lvl]}<select data-sort="${lvl}">${SORTS[lvl].map(([v, t]) => `<option value="${v}" ${S.sort[lvl] === v ? "selected" : ""}>${t}</option>`).join("")}</select></label>`;
  const flechas = (kind, id, p) => `<button class="ic" type="button" data-act="mv" data-dir="-1" data-kind="${kind}" data-id="${id}" data-p="${p}" title="Subir">↑</button><button class="ic" type="button" data-act="mv" data-dir="1" data-kind="${kind}" data-id="${id}" data-p="${p}" title="Bajar">↓</button>`;
  function listaDe(kind, p){
    if(kind === "set") return [S.sets, "sets"];
    if(kind === "group"){ const s = S.sets.find(x => x.id === p); return s ? [s.groups, "groups"] : [null]; }
    const g = C().groups.find(x => x.id === p); return g ? [g.items, "items"] : [null];
  }
  // Aplica un orden (lista de ids). Si el nivel no estaba en Manual, pasa a Manual conservando lo que se veía.
  function reordenar(kind, p, ids){
    const [arr, lvl] = listaDe(kind, p); if(!arr) return;
    const pos = new Map(ids.map((id, i) => [id, i]));
    arr.sort((a, b) => (pos.has(a.id) ? pos.get(a.id) : 1e9) - (pos.has(b.id) ? pos.get(b.id) : 1e9));
    if(S.sort[lvl] !== "manual"){ S.sort[lvl] = "manual"; toast(`«${SORT_LBL[lvl]}» pasó a Manual`); }
    save(); render();
  }
  function mover(kind, id, p, dir){
    const [arr, lvl] = listaDe(kind, p); if(!arr) return;
    const ids = ordenar(arr, lvl).map(x => x.id), i = ids.indexOf(id), j = i + dir;
    if(i < 0 || j < 0 || j >= ids.length) return;
    [ids[i], ids[j]] = [ids[j], ids[i]];
    reordenar(kind, p, ids);
  }
  // Arrastrar y soltar (mouse y táctil) desde la manija ⠿
  let drag = null;
  main.addEventListener("pointerdown", e => {
    const h = e.target.closest(".hdl"); if(!h) return;
    const row = h.closest("[data-drag]"); if(!row) return;
    e.preventDefault();
    drag = {row, list: row.parentElement, kind: row.dataset.drag, p: row.dataset.p || "", antes: [...row.parentElement.children].indexOf(row)};
    row.classList.add("dragging"); document.body.classList.add("arrastrando");
    try{ h.setPointerCapture(e.pointerId); }catch(err){}
  });
  main.addEventListener("pointermove", e => {
    if(!drag) return;
    e.preventDefault();
    const y = e.clientY;
    for(const s of drag.list.children){
      if(s === drag.row || s.dataset.drag !== drag.kind) continue;
      const r = s.getBoundingClientRect();
      if(y > r.top && y < r.bottom){
        if(y < r.top + r.height / 2){ if(s.previousElementSibling !== drag.row) drag.list.insertBefore(drag.row, s); }
        else if(s.nextElementSibling !== drag.row) drag.list.insertBefore(drag.row, s.nextSibling);
        break;
      }
    }
    if(y < 70) window.scrollBy(0, -12); else if(y > innerHeight - 50) window.scrollBy(0, 12);
  });
  function soltar(){
    if(!drag) return;
    const d = drag; drag = null;
    d.row.classList.remove("dragging"); document.body.classList.remove("arrastrando");
    if([...d.list.children].indexOf(d.row) === d.antes) return;
    reordenar(d.kind, d.p, [...d.list.children].filter(c => c.dataset.drag === d.kind).map(c => c.dataset.id));
  }
  main.addEventListener("pointerup", soltar);
  main.addEventListener("pointercancel", soltar);

  // ---------- Reglas ----------
  function contexto(){
    const ever = new Set(), memo = {}, hist = C().history;
    hist.forEach(h => h.picks.forEach(p => ever.add(p.id)));
    return { ever, recent: n => memo[n] || (memo[n] = new Set(hist.slice(0, Math.max(0, n | 0)).flatMap(h => h.picks.map(p => p.id)))) };
  }
  function coincide(r, it, g, c){
    const v = norm(r.tv);
    switch(r.tk){
      case "tag":   return !!v && (it.tags || []).some(t => norm(t) === v);
      case "group": return g.id === r.tv;
      case "text":  return !!v && norm(it.name).includes(v);
      case "hist":  return c.recent(r.n).has(it.id);
      case "nunca": return !c.ever.has(it.id);
    }
    return false;
  }
  function objetivo(r){
    switch(r.tk){
      case "tag":   return `ítems con etiqueta «${r.tv}»`;
      case "group": { const g = C().groups.find(x => x.id === r.tv); return `el subconjunto «${g ? (g.name || "sin nombre") : "(borrado)"}»`; }
      case "text":  return `ítems cuyo nombre contiene «${r.tv}»`;
      case "hist":  return (r.n | 0) === 1 ? "ítems que salieron en la última ronda" : `ítems que salieron en las últimas ${r.n | 0} rondas`;
      case "nunca": return "ítems que nunca salieron";
    }
    return "";
  }
  function textoRegla(r){
    const t = objetivo(r);
    return r.type === "excluir" ? "Excluir " + t : r.type === "solo" ? "Considerar solo " + t : `Peso ×${fmtN(num(r.factor))} a ${t}`;
  }
  // Evalúa los ítems del conjunto activo: si participan, por qué no, y su peso final (ítem × subconjunto × reglas)
  function evaluar(){
    const set = C(), c = contexto(), act = set.rules.filter(r => r.active), solos = act.filter(r => r.type === "solo"), rows = [];
    for(const g of set.groups) for(const it of g.items){
      if(!String(it.name || "").trim()) continue;
      const row = {it, g, w: num(it.weight) * num(g.weight), notes: [], why: ""};
      if(!g.active) row.why = "Subconjunto desactivado";
      else if(!it.active) row.why = "Ítem desactivado";
      else{
        if(solos.length && !solos.some(r => coincide(r, it, g, c))) row.why = "No entra en: " + solos.map(textoRegla).join(" / ");
        if(!row.why){ const ex = act.find(r => r.type === "excluir" && coincide(r, it, g, c)); if(ex) row.why = textoRegla(ex); }
        if(!row.why){
          for(const r of act) if(r.type === "peso" && coincide(r, it, g, c)){ row.w *= num(r.factor); row.notes.push("×" + fmtN(num(r.factor))); }
          if(row.w <= 0) row.why = "Peso 0";
        }
      }
      row.ok = !row.why; rows.push(row);
    }
    return rows;
  }
  function secciones(rows){
    if(C().cfg.mode === "grupo") return ordenar(C().groups, "groups").filter(g => g.active).map(g => ({g, rows: rows.filter(r => r.ok && r.g === g)}));
    return [{g: null, rows: rows.filter(r => r.ok)}];
  }

  // ---------- Sorteo ----------
  function rndCripto(){ const a = new Uint32Array(1); crypto.getRandomValues(a); return (a[0] + 1) / 4294967297; }
  const rndRapido = () => 1 - Math.random(); // (0,1], solo para estimar chances
  // Sin reposición: método de Efraimidis–Spirakis (clave u^(1/peso), se quedan las k más altas)
  function elegir(rows, k, rep, rnd = rndCripto){
    if(!rows.length) return [];
    if(rep){
      const tot = rows.reduce((a, r) => a + r.w, 0), out = [];
      for(let i = 0; i < k; i++){ let x = rnd() * tot, ch = rows[rows.length - 1]; for(const r of rows){ x -= r.w; if(x <= 0){ ch = r; break; } } out.push(ch); }
      return out;
    }
    return rows.map(r => ({r, key: Math.log(rnd()) / r.w})).sort((a, b) => b.key - a.key).slice(0, k).map(x => x.r);
  }
  function chances(rows, k, rep){
    const n = rows.length, tot = rows.reduce((a, r) => a + r.w, 0), m = new Map();
    if(!n) return m;
    if(rep) rows.forEach(r => m.set(r, 1 - Math.pow(1 - r.w / tot, k)));
    else if(k >= n) rows.forEach(r => m.set(r, 1));
    else if(k === 1) rows.forEach(r => m.set(r, r.w / tot));
    else{
      const sims = Math.max(400, Math.min(4000, Math.floor(300000 / n))), c = new Map(rows.map(r => [r, 0]));
      for(let s = 0; s < sims; s++) for(const r of elegir(rows, k, false, rndRapido)) c.set(r, c.get(r) + 1);
      rows.forEach(r => m.set(r, c.get(r) / sims));
    }
    return m;
  }
  function sortear(){
    const set = C(), rows = evaluar(), k = cnt();
    const secs = secciones(rows).map(s => ({g: s.g ? s.g.name : null, picks: elegir(s.rows, k, set.cfg.replace)}));
    if(!secs.some(s => s.picks.length)){ toast("No hay ítems elegibles con las reglas actuales"); return; }
    secs.forEach(s => s.picks.forEach(r => r.it.hits = hitsI(r.it) + 1));
    const pool = rows.filter(r => r.ok).map(r => r.it.name);
    const out = secs.map(s => ({g: s.g, items: s.picks.map(r => ({id: r.it.id, name: r.it.name, g: r.g.name}))}));
    const h = {id: uid(), at: Date.now(), mode: set.cfg.mode, secs: out, picks: out.flatMap(s => s.items)};
    set.history.unshift(h); if(set.history.length > 500) set.history.length = 500;

      case "cfg.replace": set.cfg.replace = v; break;
      case "s.name": { const s = S.sets.find(x => x.id === el.dataset.s); if(s) s.name = v; break; }
      case "g.active": g.active = v; el.closest(".grp").classList.toggle("off", !v); break;
      case "g.name": g.name = v; break;
      case "g.weight": if(fin || v !== ""){ g.weight = num(v, 1); } if(fin) el.value = g.weight; break;
      case "i.active": it.active = v; el.closest(".it").classList.toggle("off", !v); break;
      case "i.name": it.name = v; break;
      case "i.weight": if(fin || v !== ""){ it.weight = num(v, 1); } if(fin) el.value = it.weight; break;
      case "i.tags": it.tags = String(v).split(",").map(s => s.trim()).filter(Boolean); break;
      case "r.active": r.active = v; el.closest(".rule").classList.toggle("off", !v); break;
    }
    save();
    if(f.startsWith("cfg.")) renderChances();
  }
  main.addEventListener("input", onField);
  main.addEventListener("change", onField);
  main.addEventListener("keydown", e => {
    // Enter en el nombre de un ítem agrega otro debajo
    if(e.key === "Enter" && e.target.classList.contains("iname")){
      e.preventDefault();
      const g = C().groups.find(x => x.id === e.target.dataset.g); if(!g) return;
      const idx = g.items.findIndex(x => x.id === e.target.dataset.i);
      const nuevo = mkI(""); g.items.splice(idx + 1, 0, nuevo); save(); render(); enfocar(nuevo.id);
    }
  });
  function enfocar(iid){ const el = main.querySelector(`.iname[data-i="${iid}"]`); if(el){ el.focus(); el.scrollIntoView({block: "center", behavior: "smooth"}); } }

  $("#tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if(!b) return; S.tab = b.dataset.tab; save(); render(); window.scrollTo(0, 0); });
  main.addEventListener("click", e => {
    const b = e.target.closest("[data-act]"); if(!b) return;
    const set = C(), a = b.dataset.act, g = set.groups.find(x => x.id === b.dataset.g), s = S.sets.find(x => x.id === b.dataset.id);
    switch(a){
      case "sortear": sortear(); break;
      case "copiar": copiar(); break;
      case "irReglas": e.preventDefault(); S.tab = "reglas"; save(); render(); break;
      case "mv": mover(b.dataset.kind, b.dataset.id, b.dataset.p, +b.dataset.dir); break;
      case "tog": { const x = b.dataset.lvl === "sets" ? s : set.groups.find(y => y.id === b.dataset.id); if(x){ x.collapsed = !x.collapsed; save(); render(); } break; }
      case "colAll": case "expAll": (b.dataset.lvl === "sets" ? S.sets : set.groups).forEach(x => x.collapsed = a === "colAll"); save(); render(); break;
      // Conjuntos
      case "addS": { const ns = nuevoSet(""); ns.groups.push({id: uid(), name: "", active: true, weight: 1, items: [mkI("")]}); S.sets.push(ns); S.active = ns.id; save(); render();
        const el = main.querySelector(`.gname[data-s="${ns.id}"]`); if(el){ el.focus(); el.scrollIntoView({block: "center"}); } break; }
      case "useS": S.active = s.id; save(); render(); toast(`En uso: ${s.name || "Sin nombre"}`); break;
      case "editS": S.active = s.id; S.tab = "grupos"; save(); render(); window.scrollTo(0, 0); break;
      case "dupS": { const c = clonarSet(s, (s.name || "Conjunto") + " (copia)", false); S.sets.splice(S.sets.indexOf(s) + 1, 0, c); save(); render(); toast("Conjunto duplicado (sin historial ni contador)"); break; }
      case "delS": confirmar(`¿Borrar el conjunto «${esc(s.name || "sin nombre")}» con sus ${s.groups.length} subconjuntos, reglas e historial?`, "Borrar", () => {
        S.sets = S.sets.filter(x => x !== s);
        if(!S.sets.length) S.sets.push(nuevoSet("Mi conjunto"));
        if(!S.sets.some(x => x.id === S.active)) S.active = S.sets[0].id;
        save(); render(); }); break;
      // Subconjuntos e ítems
      case "addG": { const ng = {id: uid(), name: "", active: true, weight: 1, items: [mkI("")]}; set.groups.push(ng); save(); render();
        const el = main.querySelector(`.gname[data-g="${ng.id}"]`); if(el){ el.focus(); el.scrollIntoView({block: "center"}); } break; }
      case "delG": confirmar(`¿Borrar el subconjunto «${esc(g.name || "sin nombre")}» y sus ${g.items.length} ítems?`, "Borrar", () => {
        set.groups = set.groups.filter(x => x !== g); set.rules = set.rules.filter(r => !(r.tk === "group" && r.tv === g.id)); save(); render(); }); break;
      case "addI": { const ni = mkI(""); g.items.push(ni); g.collapsed = false; save(); render(); enfocar(ni.id); break; }
      case "delI": g.items = g.items.filter(x => x.id !== b.dataset.i); save(); render(); break;
      case "bulk": dlgPegar(g); break;
      // Reglas
      case "addR": dlgRegla(); break;
      case "editR": dlgRegla(set.rules.find(r => r.id === b.dataset.r)); break;
      case "delR": set.rules = set.rules.filter(r => r.id !== b.dataset.r); save(); render(); break;
      // Historial y contador
      case "delH": { const h = set.history.find(x => x.id === b.dataset.h); if(h){ descontar(set, [h]); set.history = set.history.filter(x => x !== h); save(); render(); } break; }
      case "clearH": confirmar("¿Borrar todo el historial de este conjunto? Las reglas de historial vuelven a cero y las rondas se descuentan del contador.", "Borrar todo", () => {
        descontar(set, set.history); set.history = []; save(); render(); }); break;
      case "resetHits": confirmar("¿Reiniciar a 0 el contador de veces sorteadas de este conjunto? El historial no se borra. Podés deshacerlo con «Restaurar contador».", "Reiniciar", () => {
        const hits = {}; set.groups.forEach(gg => gg.items.forEach(i => { if(hitsI(i)) hits[i.id] = hitsI(i); i.hits = 0; }));
        set.hitsBackup = {at: Date.now(), hits, prevResetAt: set.hitsResetAt || 0}; set.hitsResetAt = Date.now(); save(); render(); toast("Contador reiniciado"); }); break;
      case "restoreHits": { const bk = set.hitsBackup; if(!bk) break;
        confirmar(`¿Restaurar el contador como estaba antes del reinicio del ${fmtD(bk.at)}? Se suman los valores de antes y lo sorteado desde entonces.`, "Restaurar", () => {
          set.groups.forEach(gg => gg.items.forEach(i => i.hits = hitsI(i) + (bk.hits[i.id] || 0)));
          set.hitsResetAt = bk.prevResetAt || 0; delete set.hitsBackup; save(); render(); toast("Contador restaurado"); }); break; }
    }
  });
  async function copiar(){
    const h = C().history[0]; if(!h) return;
    const txt = textoResultado(h);
    try{ await navigator.clipboard.writeText(txt); toast("Resultado copiado"); }
    catch(e){ dlg(`<h3>Copiar resultado</h3><textarea readonly>${esc(txt)}</textarea><div class="acts"><button class="btn pri" data-x>Cerrar</button></div>`).querySelector("textarea").select(); }
  }

  // ---------- Diálogos ----------
  function dlg(html){
    const d = $("#dlg"); d.innerHTML = html;
    d.querySelectorAll("[data-x]").forEach(b => { b.type = "button"; b.onclick = () => d.close(); });
    d.oninput = d.onchange = null;
    if(!d.open) d.showModal();
    return d;
  }
  $("#dlg").addEventListener("click", e => { if(e.target.id === "dlg") e.target.close(); });
  function confirmar(msg, ok, fn){
    const d = dlg(`<h3>Confirmar</h3><p>${msg}</p><div class="acts"><button class="btn" data-x>Cancelar</button><button class="btn pri" type="button" id="cOk">${esc(ok)}</button></div>`);
    $("#cOk", d).onclick = () => { d.close(); fn(); };
  }
  function dlgPegar(g){
    const d = dlg(`<h3>Pegar ítems en «${esc(g.name || "sin nombre")}»</h3>
      <p class="mut sm" style="margin-top:0">Un ítem por línea. Opcional: <b>nombre | peso | etiquetas</b></p>
      <textarea id="bTxt" placeholder="Pizza&#10;Milanesas | 2 | casera&#10;Sushi | 1 | salida, caro"></textarea>
      <label class="chk"><input type="checkbox" id="bRep"> Reemplazar los ítems actuales</label>
      <div class="acts"><button class="btn" data-x>Cancelar</button><button class="btn pri" type="button" id="bOk">Agregar</button></div>`);
    $("#bOk", d).onclick = () => {
      const nuevos = $("#bTxt", d).value.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
        const [n, w, t] = l.split("|").map(s => (s || "").trim());
        return mkI(n, w ? num(w, 1) : 1, t ? t.split(",").map(s => s.trim()).filter(Boolean) : []);
      }).filter(i => i.name);
      if(!nuevos.length){ toast("No hay líneas para agregar"); return; }
      if($("#bRep", d).checked) g.items = nuevos; else g.items = g.items.filter(i => String(i.name).trim()).concat(nuevos);
      g.collapsed = false; save(); d.close(); render(); toast(`${nuevos.length} ítems agregados`);
    };
    setTimeout(() => $("#bTxt", d).focus(), 50);
  }
  function dlgRegla(orig){
    const set = C();
    const r = orig ? {...orig} : {id: uid(), active: true, type: "peso", tk: "tag", tv: "", n: 3, factor: 2};
    const d = dlg(`<h3>${orig ? "Editar regla" : "Nueva regla"}</h3>
      <label>Acción<select id="rType">
        <option value="excluir">Excluir (no participan)</option>
        <option value="solo">Considerar solo (el resto queda afuera)</option>
        <option value="peso">Cambiar el peso (más o menos chances)</option></select></label>
      <label id="rFacL">Multiplicar el peso por<input id="rFac" type="number" min="0" step="0.1" inputmode="decimal" value="${num(r.factor, 2)}">
        <small>2 = el doble de chances · 0,5 = la mitad · 0 = nunca</small></label>
      <label>Aplica a<select id="rTk">
        <option value="tag">Ítems con una etiqueta</option>
        <option value="group">Un subconjunto</option>
        <option value="text">Ítems cuyo nombre contiene un texto</option>
        <option value="hist">Ítems que salieron en las últimas N rondas</option>
        <option value="nunca">Ítems que nunca salieron</option></select></label>
      <label id="rTagL">Etiqueta<input id="rTag" list="rTags" autocomplete="off"><datalist id="rTags">${allTags().map(t => `<option value="${esc(t)}">`).join("")}</datalist></label>
      <label id="rGrpL">Subconjunto<select id="rGrp">${set.groups.map(g => `<option value="${g.id}">${esc(g.name || "sin nombre")}</option>`).join("")}</select></label>
      <label id="rTxtL">Texto<input id="rTxt" autocomplete="off"></label>
      <label id="rNL">Cantidad de rondas<input id="rN" type="number" min="1" step="1" inputmode="numeric" value="${r.n || 3}"></label>
      <p class="mut sm" id="rPrev"></p>
      <div class="acts"><button class="btn" data-x>Cancelar</button><button class="btn pri" type="button" id="rOk">Guardar</button></div>`);
    const q = id => $("#" + id, d);
    q("rType").value = r.type; q("rTk").value = r.tk;
    if(r.tk === "tag") q("rTag").value = r.tv;
    if(r.tk === "text") q("rTxt").value = r.tv;
    if(r.tk === "group" && r.tv) q("rGrp").value = r.tv;
    function leer(){
      r.type = q("rType").value; r.tk = q("rTk").value; r.factor = num(q("rFac").value, 1); r.n = Math.max(1, parseInt(q("rN").value) || 1);
      r.tv = r.tk === "tag" ? q("rTag").value.trim() : r.tk === "text" ? q("rTxt").value.trim() : r.tk === "group" ? q("rGrp").value : "";
    }
    function sync(){
      leer();
      q("rFacL").style.display = r.type === "peso" ? "" : "none";
      q("rTagL").style.display = r.tk === "tag" ? "" : "none";
      q("rGrpL").style.display = r.tk === "group" ? "" : "none";
      q("rTxtL").style.display = r.tk === "text" ? "" : "none";
      q("rNL").style.display = r.tk === "hist" ? "" : "none";
      const c = contexto(); let n = 0;
      set.groups.forEach(g => g.items.forEach(it => { if(String(it.name).trim() && coincide(r, it, g, c)) n++; }));
      q("rPrev").textContent = `«${textoRegla(r)}» · hoy alcanza a ${n} ${n === 1 ? "ítem" : "ítems"}.`;
    }
    d.oninput = sync; d.onchange = sync; sync();
    q("rOk").onclick = () => {
      leer();
      if((r.tk === "tag" || r.tk === "text") && !r.tv){ toast("Completá el valor de la regla"); return; }
      if(r.tk === "group" && !r.tv){ toast("No hay subconjuntos para elegir"); return; }
      const i = set.rules.findIndex(x => x.id === r.id);
      if(i >= 0) set.rules[i] = r; else set.rules.push(r);
      save(); d.close(); render();
    };
  }

  // ---------- Menú: tema, exportar / importar ----------
  $("#menuBtn").addEventListener("click", abrirMenu);
  function abrirMenu(){
    const d = dlg(`<h3>Más opciones</h3>
      <p class="mut sm" style="margin:0 0 6px">Tema</p>
      <div class="seg">${[["system", "🖥️ Sistema"], ["light", "☀️ Claro"], ["dark", "🌙 Oscuro"]].map(([v, t]) =>
        `<button class="btn ${S.theme === v ? "on" : ""}" type="button" data-tema="${v}">${t}</button>`).join("")}</div>
      <div class="menu">
        <button class="btn" type="button" id="mExp">⬇️ Exportar datos (.json)</button>
        <button class="btn" type="button" id="mImp">⬆️ Importar datos (.json)</button>
        <button class="btn" type="button" id="mEj">✨ Agregar el conjunto de ejemplo</button>
        <button class="btn danger" type="button" id="mVac">🗑 Vaciar todo</button></div>
      <p class="mut sm">Los datos se guardan en este navegador. Exportá un archivo para pasarlos a otro dispositivo o tener una copia.</p>
      <div class="acts"><button class="btn" data-x>Cerrar</button></div>`);
    d.querySelectorAll("[data-tema]").forEach(b => b.onclick = () => { S.theme = b.dataset.tema; save(); aplicarTema(); abrirMenu(); });
    $("#mExp", d).onclick = () => { exportar(); d.close(); };
    $("#mImp", d).onclick = () => { d.close(); $("#fileIn").click(); };
    $("#mEj", d).onclick = () => { const s = ejemploSet(); S.sets.push(s); S.active = s.id; save(); d.close(); render(); toast("Conjunto de ejemplo agregado"); };
    $("#mVac", d).onclick = () => confirmar("¿Borrar todos los conjuntos, con sus subconjuntos, reglas e historial? Conviene exportar antes.", "Vaciar", () => {
      const s = nuevoSet("Mi conjunto"); S.sets = [s]; S.active = s.id; S.tab = "grupos"; save(); render(); });
  }
  function exportar(){
    const v = (document.querySelector('meta[name="app-version"]') || {}).content || "";
    const blob = new Blob([JSON.stringify({app: "random", version: v, exportado: new Date().toISOString(), data: S}, null, 2)], {type: "application/json"});
    const a = document.createElement("a"), d = new Date();
    a.href = URL.createObjectURL(blob);
    a.download = `random-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast("Archivo exportado");
  }
  $("#fileIn").addEventListener("change", async e => {
    const f = e.target.files[0]; e.target.value = ""; if(!f) return;
    try{
      const j = JSON.parse(await f.text()), nd = cargar(j && j.data ? j.data : j);
      if(!nd) throw new Error();
      const d = dlg(`<h3>Importar</h3><p>El archivo trae ${nd.sets.length} ${nd.sets.length === 1 ? "conjunto" : "conjuntos"}: ${nd.sets.map(s => "«" + esc(s.name || "sin nombre") + "»").join(", ")}.</p>
        <div class="menu"><button class="btn" type="button" id="iAdd">➕ Agregarlos como conjuntos nuevos</button>
        <button class="btn danger" type="button" id="iRep">♻️ Reemplazar todos mis datos</button></div>
        <div class="acts"><button class="btn" data-x>Cancelar</button></div>`);
      $("#iAdd", d).onclick = () => { const add = nd.sets.map(s => clonarSet(s, null, true)); S.sets.push(...add); S.active = add[0].id; save(); d.close(); render(); toast(`${add.length} conjuntos agregados`); };
      $("#iRep", d).onclick = () => { nd.theme = S.theme; S = nd; save(); d.close(); aplicarTema(); render(); toast("Datos importados"); };
    }catch(err){ toast("El archivo no tiene un formato válido"); }
  });

  let tt;
  function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2200); }

  save();
  render();
})();
</script>
<!-- ===== Versión (estándar caja de apps) — bloque autónomo =====
     Requiere en el <head>: <meta name="app-version" content="vX.Y.Z">
     y en el encabezado: <button id="verBtn" class="vs-ver" type="button">v—</button>
     (o, si la app ya muestra su propio texto de versión, marcar ese elemento con data-vs-open:
      al tocarlo abre el diálogo y no se le cambia el texto).
     1) El número escrito en el HTML se ve siempre (sin conexión, Apps Script, caché vieja).
     2) Fecha y Changelog desde las Releases de GitHub (sin conexión: última copia guardada).
     3) Si GitHub tiene una versión más alta: aviso "Hay una versión nueva, recargá". -->
<style>
  .vs-ver{border:1px solid #d0d5dd;background:#fff;color:#555;font:600 12px system-ui,sans-serif;padding:3px 10px;border-radius:999px;cursor:pointer;vertical-align:middle}
  .vs-ver.new,[data-vs-open].new{border-color:#d97706;color:#d97706}
  [data-vs-open]{cursor:pointer}
  .vs-upd{display:none;position:sticky;top:0;z-index:9998;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;background:#f59e0b;color:#1c1f26;font:14px system-ui,sans-serif}
  .vs-upd.on{display:flex}
  .vs-upd button,.vs-dlg .vs-acts button,.vs-dlg .vs-acts a{border:1px solid #c9ced6;border-radius:10px;padding:8px 13px;background:#fff;color:#1c1f26;font:14px system-ui,sans-serif;cursor:pointer;text-decoration:none}
  .vs-upd button{border-color:#1c1f26;background:#1c1f26;color:#fff}
  .vs-dlg{border:1px solid #d0d5dd;border-radius:16px;padding:20px;max-width:min(560px,92vw);width:100%;font:15px/1.45 system-ui,sans-serif;color:#1c1f26;background:#fff}
  .vs-dlg h3{margin:0 0 8px}.vs-dlg .vs-mut{color:#6b7280}
  .vs-dlg .vs-rels{max-height:60vh;overflow:auto}
  .vs-dlg .vs-rel{border-top:1px solid #e5e7eb;padding:10px 0}.vs-dlg .vs-rel pre{white-space:pre-wrap;font:inherit;font-size:14px;color:#6b7280;margin:4px 0 0}
  .vs-dlg .vs-acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:14px}
  @media print{.vs-ver,.vs-upd,.vs-dlg{display:none!important}}
  .vs-dlg .vs-acts .vs-pri{background:#4f46e5;border-color:#4f46e5;color:#fff}
</style>
<div class="vs-upd" id="vsUpd" role="status"><span id="vsUpdTxt">Hay una versión nueva, recargá.</span><button type="button" id="vsUpdBtn">Recargar</button></div>
<dialog class="vs-dlg" id="vsDlg"></dialog>
<script>
(function(){
  const REPO = "luchorcompartidos/random";                       // usuario/repo de GitHub
  const LOG_FN = "";                   // función propia de Changelog de la app (vacío = usar el de GitHub)
  const KEY  = "vs_rels_" + REPO;
  const APP_VERSION = (document.querySelector('meta[name="app-version"]')||{}).content || "v—";
  const $ = id => document.getElementById(id);
  const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmt = s => new Date(s).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
  const semv = t => (String(t).replace(/^v/,"").split(".").map(n=>parseInt(n)||0).concat([0,0,0])).slice(0,3);
  const cmpV = (a,b) => { const x=semv(a), y=semv(b); for(let i=0;i<3;i++) if(x[i]!==y[i]) return y[i]-x[i]; return 0; };
  let rels = null; try{ rels = JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){}
  // Estado de la última consulta a GitHub: así el diálogo distingue "no está publicada" de "no se pudo consultar"
  let relsAt = 0; try{ relsAt = +localStorage.getItem(KEY+"_t") || 0; }catch(e){}
  let lastFail = false, loading = null;
  // Si el diálogo quedó fuera del <body> (bloque pegado al final), lo movemos
  [$("vsUpd"),$("vsDlg")].forEach(el=>{ if(el && el.parentNode!==document.body) document.body.appendChild(el); });
  document.body.insertBefore($("vsUpd"), document.body.firstChild);
  // Dentro de Apps Script la app sale de la copia del script: recargar no alcanza, hay que actualizarlo.
  const GAS = !!(window.google && window.google.script && window.google.script.run);
  const REL_URL = `https://github.com/${REPO}/releases`;
  if(GAS){ const ub=$("vsUpdBtn"); ub.textContent = "Ver Releases"; }
  const ultima = () => rels && rels[0];
  const hayNueva = () => !!(ultima() && APP_VERSION!=="v—" && cmpV(ultima().tag, APP_VERSION) < 0);
  function show(){
    const b = $("verBtn"), n = hayNueva();
    if(b){ b.textContent = APP_VERSION + (n?" ⬆":""); b.classList.toggle("new", n); b.title = n ? "Hay una versión nueva: "+ultima().tag : "Versión"; }
    document.querySelectorAll("[data-vs-open]").forEach(el=>{ el.classList.toggle("new", n); if(n) el.title = "Hay una versión nueva: "+ultima().tag; });
    $("vsUpd").classList.toggle("on", n);
    if(n) $("vsUpdTxt").textContent = GAS ? `Hay una versión nueva (${ultima().tag}): actualizá el script de Apps Script.`
                                          : `Hay una versión nueva (${ultima().tag}), recargá.`;
  }
  function load(){ if(!loading) loading = doLoad().finally(()=>{ loading = null; }); return loading; }
  async function doLoad(){
    try{
      const r = await fetch(`https://api.github.com/repos/${REPO}/releases?per_page=100`,{headers:{Accept:"application/vnd.github+json"},cache:"no-store"});
      if(!r.ok){ lastFail = true; return; }
      lastFail = false; relsAt = Date.now(); try{ localStorage.setItem(KEY+"_t", String(relsAt)); }catch(e){}
      rels = (await r.json()).filter(x=>!x.draft && !x.prerelease).map(x=>{
        const f = (x.assets||[]).map(a=>a.updated_at).filter(Boolean).sort();
        return { tag:x.tag_name, date:f.length?f[f.length-1]:(x.published_at||x.created_at), deArchivo:f.length>0, body:x.body||"" };
      }).sort((a,b)=>cmpV(a.tag,b.tag));
      try{ localStorage.setItem(KEY, JSON.stringify(rels)); }catch(e){}
      show();
    }catch(e){ lastFail = true; }
  }
  function recargar(){ if(GAS){ window.open(REL_URL, "_blank", "noopener"); return; } const u = new URL(location.href); u.searchParams.set("v", Date.now()); location.replace(u); }
  function dlg(html){
    const d = $("vsDlg"); d.innerHTML = html;
    d.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>d.close());
    if(!d.open) d.showModal(); return d;
  }
  let reintento = false;
  function openVer(){
    const r = (rels||[]).find(x=>x.tag===APP_VERSION), n = hayNueva();
    const hace = relsAt ? ` (información de hace ${Math.max(1, Math.round((Date.now()-relsAt)/60000))} min)` : "";
    // Si la lista guardada no tiene esta versión, se vuelve a consultar GitHub antes de concluir nada
    if(!r && !reintento && navigator.onLine !== false){ reintento = true; dlg(`<h3>Versión ${esc(APP_VERSION)}</h3><p class="vs-mut">Consultando GitHub…</p>`); load().then(()=>{ if($("vsDlg").open) openVer(); reintento = false; }); return; }
    const fecha = r ? (r.deArchivo?"Archivos actualizados el ":"Publicada el ")+"<b>"+fmt(r.date)+"</b>"
                    : navigator.onLine === false ? `Sin conexión: no se puede consultar GitHub ahora${rels ? hace : ""}.`
                    : lastFail ? `No se pudo consultar GitHub (puede ser un límite de consultas seguidas). Probá de nuevo en unos minutos${rels ? hace : ""}.`
                    : rels ? "Esta versión todavía no figura en las Releases de GitHub. Se publica unos segundos después de cada entrega: probá de nuevo en un minuto."
                    : "Fecha no disponible (requiere conexión).";
    const d = dlg(`<h3>Versión ${esc(APP_VERSION)}</h3><p class="vs-mut">${fecha}</p>${n?`<p><b>Hay una versión nueva: ${esc(ultima().tag)}.</b>${GAS?" Para usarla, actualizá el script de Apps Script.":""}</p>`:""}
      <div class="vs-acts">${n?`<button class="vs-pri" id="vsRec" type="button">${GAS?"Ver Releases":"↻ Recargar"}</button>`:""}<button ${n?"":'class="vs-pri"'} id="vsLog" type="button">📋 Changelog</button><button data-x type="button">Cerrar</button></div>`);
    d.querySelector("#vsLog").onclick = () => { if(LOG_FN && typeof window[LOG_FN]==="function"){ d.close(); window[LOG_FN](); } else openLog(); };
    const rb = d.querySelector("#vsRec"); if(rb) rb.onclick = recargar;
  }
  function openLog(){
    const list = (rels||[]).map(r=>`<div class="vs-rel"><b>${esc(r.tag)}</b>${r.tag===APP_VERSION?' <span class="vs-mut">(la que estás usando)</span>':""} · <span class="vs-mut">${fmt(r.date)}</span>${r.body?`<pre>${esc(r.body)}</pre>`:""}</div>`).join("");
    dlg(`<h3>Changelog</h3><div class="vs-rels">${list||'<p class="vs-mut">Sin datos todavía (requiere conexión).</p>'}</div>
      <div class="vs-acts"><a href="${REL_URL}" target="_blank" rel="noopener">Ver Releases en GitHub ↗</a><button data-x type="button">Cerrar</button></div>`);
  }
  $("vsDlg").addEventListener("click", e=>{ if(e.target.id==="vsDlg") e.target.close(); });
  if($("verBtn")) $("verBtn").addEventListener("click", openVer);
  document.querySelectorAll("[data-vs-open]").forEach(el=>el.addEventListener("click", openVer));
  window.VS = { abrir: openVer, version: APP_VERSION, hayNueva };
  $("vsUpdBtn").addEventListener("click", recargar);
  show(); load();
  // Se vuelve a consultar al volver a la app, si la información tiene más de 10 minutos
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && Date.now()-relsAt > 600000) load(); });
  window.addEventListener("online", ()=>load());
})();
</script>
<!-- ===== fin bloque Versión ===== -->
</body>
</html>
